services:
  # app:
  #   build: ./web
  #   restart: unless-stopped
  #   ports:
  #     - "3001:3001"
  #   depends_on: 
  #     - db
  #   volumes:
  #     - ./web:/web
  #   environment:
  #     - PORT=3001
  db:
    image: postgres
    restart: unless-stopped
    ports: 
      - "5432:5432"
    volumes:
      - ccvol:/var/lib/postgresql
      # all migrations, in filename order
      - ./sql:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_PASSWORD=qwf
  # dev inbox: catches all outgoing mail (verification/reset links), ui at :8025
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  ccvol:
